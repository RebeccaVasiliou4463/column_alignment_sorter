[project]
name = "column-alignment-sorter"
version = "0.1.0"
description = "Sorts lines of aligned text by a user-specified column index, preserving whitespace alignment of the remaining columns."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
